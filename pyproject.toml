[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diligram-rag"
version = "0.1.0"
description = "Multi-hop retrieval and citation-grounded answering over parsed documents."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 检索与生成的重依赖单独隔开，骨架阶段只要求能跑数据结构测试
retrieval = ["numpy>=1.26"]
graph = ["networkx>=3.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
